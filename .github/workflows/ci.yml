name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ClipboardManager.sln -p:NuGetAudit=false

      - name: Build
        run: dotnet build ClipboardManager.sln --configuration Release --no-restore -p:NuGetAudit=false

      - name: Test
        run: dotnet test ClipboardManager.sln --configuration Release --no-build -p:NuGetAudit=false
