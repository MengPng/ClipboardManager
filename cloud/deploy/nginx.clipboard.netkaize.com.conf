server {
    listen 80;
    listen [::]:80;
    server_name clipboard.netkaize.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name clipboard.netkaize.com;

    ssl_certificate /etc/letsencrypt/live/clipboard.netkaize.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clipboard.netkaize.com/privkey.pem;

    client_max_body_size 105m;

    # 下载页与更新清单（静态，由 scripts/publish-download.ps1 上传到 /var/www/download）
    location = /download { return 301 /download/; }
    location ^~ /download/ {
        root /var/www;
        index index.html;
        charset utf-8;
        charset_types application/json;
        add_header Cache-Control "no-cache";
        location ~ \.json$ {
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }
        location ^~ /download/files/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location / {
        proxy_pass http://127.0.0.1:53180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
