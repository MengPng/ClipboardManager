services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clipboardmanager
      POSTGRES_USER: clipboardmanager_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    group_add:
      - "21000"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipboardmanager_owner -d clipboardmanager"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 640m
    cpus: 0.75

  api:
    image: clipboardmanager-cloud-api:${IMAGE_TAG}
    build:
      context: ../..
      dockerfile: cloud/ClipboardManager.Cloud.Api/Dockerfile.build
    restart: unless-stopped
    ports:
      - "127.0.0.1:53180:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      CloudDatabase__Host: postgres
      CloudDatabase__Database: clipboardmanager
      CloudDatabase__Username: clipboardmanager_owner
      CloudDatabase__PasswordFile: /run/secrets/postgres_password
      FeatureFlags__CloudEnabled: "true"
      TencentCos__Region: ${TENCENT_COS_REGION}
      TencentCos__Bucket: ${TENCENT_COS_BUCKET}
    secrets:
      - postgres_password
    group_add:
      - "21000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    cpus: 0.75

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
